version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: drishti_lens
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: "postgresql+asyncpg://drishti:drishti_dev@postgres:5432/drishti_lens"
      NATS_URL: "nats://nats:4222"
      JWT_SECRET: "dev-secret-change-in-prod-32-chars-minimum-length"
      JWT_ALGO: HS256
      ACCESS_TOKEN_EXPIRE_MIN: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      UPLOAD_DIR: /app/uploads
      MODEL_DIR: /app/assets/models
      DEMO_IMAGES_DIR: /app/assets/demo
      DOCTOR_CSV_PATH: /app/assets/seed/doctors.csv
      HOSPITAL_CSV_PATH: /app/assets/seed/hospitals.csv
      OFFICER_CSV_PATH: /app/assets/seed/officers.csv
      PATIENT_CSV_PATH: /app/assets/seed/patients.csv
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/assets:/app/assets
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
